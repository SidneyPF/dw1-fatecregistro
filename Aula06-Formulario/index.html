<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário</title>
  </head>
  <body>
    <h1>Formulários no HTML5</h1>
    <form action="#" method="POST">
      <label for="nome">Nome:</label><br />
      <input name="nome" type="text" id="nome" placeholder="Insira o seu nome completo"/>
      <br />

      <label for="email">Email:</label><br />
      <input name="email" type="email" id="email" placeholder="Insira seu email" /><br />

      <label for="senha">Senha:</label><br />
      <input name="senha" type="password" id="senha" placeholder="Insira sua senha" /><br />
    
      <br />
      <input type="submit" value="Cadastrar" />
      <input type="reset" value="Limpar" />
    
    </form>
    
    <br /><br />
    <hr />
    <h4>Outros inputs:</h4>
    <form>
      <label>Quantidade:</label><br />
      <input type="number" min="0" max="10" /><br />
      <label>Data:</label><br />
      <input type="date" />
      <input type="file" /><br />
      <label>Comentarios:</label><br />
      <textarea rows="4" cols="40"></textarea>
      <input type="hidden" name="idProduto" value="9" /><br />
      <label>Cursos:</label><br />
      <select name="Cursos">
        <option value="1">Programação</option>
        <option value="2">Design Gráfico</option>
        <option value="3">Música</option>
        <option value="4">Enfermagem</option>
      </select>
    </form>
    <br><br>
    <hr>
    <h2>Exemplo de formulário completo:</h2>
    <!-- Formulário de completo -->
    <h4>Cadastro de Usuário</h4> 
    <form action="#" method="post">
        <fieldset>
            <legend>Dados Pessoais:</legend>
            <label for="name">Nome:</label>
            <input type="text" placeholder="Insira seu nome" id="name" name="name" required>
            <br>
            <label for="nascimento">Data de Nascimento:</label>
            <input type="date">
            <br>
            <label for="sexo">Sexo:</label>
            <input type="radio" name="sexo"> Masculino
            <input type="radio" name="sexo"> Feminino
            <input type="text" name="sexo" > Prefiro não informar
        </fieldset>
        <br>
        <fieldset>
            <legend>Dados de endereço:</legend>
            <label for="rua">Rua:</label>
            <input type="text" >
            <label for="number">Número:</label>
            <input type="number">
        </fieldset>
        <br>
        <fieldset>
            <legend>Dados do Produto:</legend>
            <label>Cor do Produto:</label>
            <input type="color"> <br><br>

            <input type="checkbox" required>Li e aceito os termos de uso
            <br><br>
            <input type="text" placeholder="Este campo está desativado" disabled>
            <input type="submit" value="Cadastrar">
            <input type="reset" value="Limpar">
        </fieldset>
     </form>




  </body>
</html>
