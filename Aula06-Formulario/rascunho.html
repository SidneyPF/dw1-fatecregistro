<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<!-- tag <Form> Define um formulario e envolve todos os campos que farão parte da coleta de dados-->
    <form>
        <!-- Campos do formulário -->
    </form>
    <!-- Atributos principais:
    Action: Define para onde os dados do formulário serão enviados.
    method: Define o método HTTP que será usado para enviar os dados (GET ou POST). -->

    <form action="/processardados" method="POST">
        <!-- Campos do formulário --> 
    </form>
    
    <!-- A tag <Input> é usada para criar diferentes tipos de campos de entrada -->
        
        <input type="text">
        <input type="email">
        <input type="password">
        <input type="number">
        <input type="date">
        <input type="radio">
        <input type="checkbox">
    <!-- Cada tipo define o tipo de dado esperado -->

</body>
</html>
