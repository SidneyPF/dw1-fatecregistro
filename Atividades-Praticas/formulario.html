<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário de Cadastro</title>
</head>

<body>
    <h1>Cadastro de aluno - DSM</h1>
    <p>
        Este formulário tem como finalidade realizar o cadastro dos alunos do
        curso de Desenvolvimento de Sistemas (DSM), reunindo informações
        necessárias para identificação e organização dos dados acadêmicos.
    </p>
    <form action="#" method="post">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <label for="nome">Nome Completo:</label>
            <input type="text" name="nome" id="nome" required />
            
            <br />

            <label for="email">Email:</label>
            <input type="email" name="email" id="email" />
            
            <br />

            <label for="nascimento">Data de Nascimento:</label>
            <input type="date" name="nascimento" id="nascimento" />
        </fieldset>

        <br /><br /><br />

        <fieldset>
            <legend>Dados Acadêmicos</legend>
            <label for="curso">Curso:</label>
            <select name="curso" id="curso">
                <option>-Selecione um Curso-</option>
                <option>DSM</option>
                <option>ADS</option>
                <option>Outro</option>
            </select>
           
            <br/>

            <label for="periodo">Período:</label>
            <label for="Manhã">Manhã</label>
            <input type="radio" name="periodo" id="Manhã" />
            <label for="Tarde">Tarde</label>
            <input type="radio" name="periodo" id="Tarde" />
            
            <br>

            <textarea name="" id="" placeholder="Comentários adicionais..."></textarea>
        </fieldset>
        
        <br />

        <input type="submit" value="Enviar" />
        <input type="reset" value="Limpar" />
    </form>
</body>

</html>
