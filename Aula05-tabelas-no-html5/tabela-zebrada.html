<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Zebrada</title>
    <style>
        tr:nth-child(odd) {
            background-color: #c9c7c7;
        }
        tr:nth-child(even) {
            background-color: #4b4b4b;
        }
        body{
            font-family: 'Verdana';
            color: aliceblue;
        }
    </style>
</head>
<body>
    <!-- tabela zebrada -->
     <table border="1">
        <thead>
            <tr>
                <th colspan="6">
                    <h3>Tabela de clientes</h3>
                </th>
            </tr>
            <tr>
                <th scope="col" colspan="3">Dados Pessoais :</th>
                <th scope="col" colspan="2">Endereço :</th>
                <th scope="col">Contato :</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <!-- dados pessoais -->
                <th scope="col">Nome:</th>
                <th scope="col">Idade:</th>
                <th scope="col">Profissão:</th>
                <!-- endereço -->
                <th scope="col">Rua:</th>
                <th scope="col">cidade:</th>
                <!-- contato -->
                 <th scope="col">E-mail:</th>
            </tr>
            <tr>
                <td>Ana de Souza Pereira</td>
                <td>25</td>
                <td>Engenheira</td>
                <td>Av. A</td>
                <td>São Paulo</td>
                <td>ana.pereira@email.com</td>
            </tr>
            <tr>
                <td>João Ricardo das neves</td>
                <td>30</td>
                <td>Advogado</td>
                <td>Av. B</td>
                <td>Rio de Janeiro</td>
                <td>joao.neves@email.com</td>
            </tr>
        </tbody>
     </table>
</body>
</html>
