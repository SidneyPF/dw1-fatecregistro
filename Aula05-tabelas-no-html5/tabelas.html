<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Tabelas</title>
</head>

<body>
    <h1>Tabelas em HTML5</h1>
    <!-- Estrutura mínima de uma tabela -->
    <table border="1">
        <tr>
            <td>Dado 1</td>
            <td>Dado 2</td>
            <td>Dado 3</td>
        </tr>
        <tr>
            <td>Dado 4</td>
            <td>Dado 5</td>
            <td>Dado 6</td>
        </tr>
    </table>
    <!-- br : break line(quebra de linha) -->
    <br><br><br>

    <!-- Exemplo de tabela completa (com mesclagem) -->
    <table border="1">
        <caption>Vendas do mês</caption>
        <!-- Cabeçalho da tabela- -->
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço</th>
            </tr>
        </thead>
        <!-- Corpo da tabela -->
        <tbody>
            <!-- linha 1 -->
            <tr>
                <td rowspan="2">Mouse</td>
                <td>10</td>
                <td>R$ 50,00</td>
            </tr>
            <!-- linha 2 -->
            <tr>
                <td>5</td>
                <td>R$ 100,00</td>
            </tr>
        </tbody>
        <!-- Rodapé da tabela -->
         <tfoot>
            <tr>
                <!-- colspan mescla colunas -->
                <td colspan="2">Total:</td>
                <td>R$ 150,00</td>
            </tr>
         </tfoot>
    </table>

    <!-- Tabela completa com o atributo scope -->
    <br><br><br>
    <table border="1">
        <caption>Notas dos alunos por disciplina</caption>
        <thead>
            <tr>
                <th scope="col">Aluno</th>
                <th scope="col">Matemática</th>
                <th scope="col">Português</th>
                <th scope="col">História</th>
            </tr>
        </thead>
        <tbody>
            <!-- linha 1 : Ana -->
            <tr>
                <td scope="row">Ana</td>
                <td>8,5</td>
                <td>7,0</td>
                <td>9,0</td>
            </tr>
            <!-- Linha 2 : Bruno -->
            <tr>
                <td scope="row">Bruno</td>
                <td>7,5</td>
                <td>8,0</td>
                <td>8,5</td>
            </tr>
            <!-- Linha 3 : Carlos -->
             <tr>
                <td scope="row">Carlos</td>
                <td>9,0</td>
                <td>8,5</td>
                <td>7,0</td>
            </tr>
        </tbody>
        
    </table>
</body>
</html>
