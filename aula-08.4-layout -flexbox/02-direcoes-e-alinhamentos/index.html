<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direções e Alinhamentos - Flexbox</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Flexbox - Direções e Alinhamentos</h2>
    <div class="container row-center">
        <div class="card">card 1</div>
        <div class="card">card 2</div>
        <div class="card">card 3</div>
    </div>

    <p>Coluna à esquerda</p>
    <div class="container column-left">
        <div class="card">1</div>
        <div class="card">2</div>
        <div class="card">3</div>
    </div>

    <p>linha espaçada (space-between)</p>
    <div class="container row-space-between">
        <div class="card">4</div>
        <div class="card">5</div>
        <div class="card">6</div>
    </div>

    <p>linha com espaço em volta (space-around)</p>
    <div class="container row-space-around">
        <div class="card">7</div>
        <div class="card">8</div>
        <div class="card">9</div>
    </div>

    <p>quebra de linha (Flex-wrap)</p>
    <div class="container flex-wrap">
        <div class="cardMaior">7</div>
        <div class="cardMaior">8</div>
        <div class="cardMaior">9</div>
        <div class="cardMaior">10</div>
        <div class="cardMaior">11</div>
        <div class="cardMaior">12</div>
        <div class="cardMaior">13</div>
        <div class="cardMaior">14</div>
        <div class="cardMaior">15</div>
    </div>

    <p>Atividade</p>
    <div class="container row-center1">
        <div class="cardMenor">Atividade 1</div>
        <div class="cardMenor">Atividade 2</div>
        <div class="cardMenor">Atividade 3</div>
    </div>
</body>
</html>
