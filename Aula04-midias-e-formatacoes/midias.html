<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inserindo midias no HTML 5</title>
</head>

<body>
    <h1>Inserindo midias no HTML 5</h1>

    <h2>Imagens:</h2>
    <img src=".\midias\imagem.jpg" alt="Foto de paisagem" width="300px" height="300px">

    <h2>Imagens com legenda:</h2>
    <figure>
        <img src=".\midias\grafico.png" alt="Grafico de crescimento anual da empresa" width="300px" height="300px">
        <figcaption>Gráfico de crescimento anual da empresa</figcaption>
    </figure>

    <h2>Áudio:</h2>
    <audio controls>
        <source src=".\midias\audio.mp3" type="audio/mpeg">
        Não foi possível reproduzir o áudio.
    </audio>

    <h2>Vídeo:</h2>
    <video controls width="400px">
        <source src=".\midias\video.mp4" type="video/mp4">
        Não foi possível reproduzir o vídeo.
    </video>

    <h2>Vídeo incorporado do Youtube:</h2>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/kjVfawYvDJU?si=Euk5T2LUAf_E6q5J"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
    </iframe>

    <h2>Mapas:</h2>
    <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1815.1743055100746!2d-47.84377603757509!3d-24.508016758102833!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94c5339a7e8698d7%3A0xd588f106739385b6!2sRegistro%20-%20SP!5e0!3m2!1spt-BR!2sbr!4v1788217314997!5m2!1spt-BR!2sbr"
        width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin">
    </iframe>

    <h2>incorporando PDFs:</h2>
    <iframe src=".\midias\documento.pdf" title="Horários de DSM1" width="600" height="450" style="border:0;"></iframe>
</body>

</html>
