<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS inline</title>
</head>

<body>
    <h1>Demonstração de CSS Inline</h1>
    <p style="color: blue; font-size: 18px;">Este parágrafo utiliza Css inline através do atributo style.</p>
    <p style="color: red; 
    font-weight: bold;
    background-color: yellow;">Outro parágrafo com múltiplas propriedades CSS inline.</p>
    <p>

        <!-- padding : espaçamento interno/ margin: espaçamento externo -->
    <div style="border: 2px solid green; width: 400px; padding: 30px; margin: 50px;">
        Está é uma div estilizada com CSS, inline.
    </div>
    </p>

    <h2 style="color: #774af5; text-align: center;">
        Título centralizado com cor hexadecimal
    </h2>

    <div style="width: 600px; height: 400px; background-color: orange; color: white; font-size: 32px; text-align: center;">Desafio Css Inline</div>

</body>

</html>
